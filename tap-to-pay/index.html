<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>BarberLink · Stripe</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f2f2f7; color: #111; font: 17px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
    main { max-width: 440px; width: 100%; padding: 28px; border-radius: 24px; background: white; }
    h1 { font-size: 26px; line-height: 1.2; }
    p { color: #555; }
    a { display: block; padding: 15px 20px; border-radius: 14px; color: white; background: #111; text-align: center; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #246bce; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Continúa en BarberLink</h1>
    <p id="message">Vuelve a la app para consultar tu cuenta de Stripe y continuar desde el paso pendiente.</p>
    <a id="return" href="barberlink://tap-to-pay?connect=return">Volver a BarberLink</a>
    <p id="note">Volver de Stripe no confirma la verificación. BarberLink comprobará el estado de tu cuenta.</p>
  </main>
  <script>
    (() => {
      const query = new URLSearchParams(window.location.search);
      const action = query.get('connect') === 'refresh' ? 'refresh' : 'return';
      // OAuth's independent, short-lived handoff is delivered only to this
      // browser in a fragment. Never forward account IDs, provider tokens or URLs.
      const fragment = new URLSearchParams((window.location.hash || '').slice(1));
      const handoff = fragment.get('handoff');
      const error = fragment.get('error');
      let link = 'barberlink://tap-to-pay?connect=' + action;
      if (fragment.getAll('handoff').length === 1 && /^[a-f0-9]{64}$/.test(handoff || '') && !error) link += '&handoff=' + handoff;
      else if (['cancelled', 'expired', 'unavailable', 'incompatible', 'failed'].includes(error) && fragment.getAll('error').length === 1) link += '&error=' + error;
      else if (handoff || error) link += '&error=expired';
      document.getElementById('return').href = link;
      if (window.location.hash && window.history) window.history.replaceState(null, '', window.location.pathname + window.location.search);
      if (!navigator.language.toLowerCase().startsWith('es')) {
        document.documentElement.lang = 'en';
        document.getElementById('heading').textContent = 'Continue in BarberLink';
        document.getElementById('message').textContent = 'Return to the app to check your Stripe account and continue from the remaining step.';
        document.getElementById('return').textContent = 'Return to BarberLink';
        document.getElementById('note').textContent = 'Returning from Stripe does not confirm verification. BarberLink will check your account status.';
      }
      // Keep the visible button as a fallback when iOS blocks automatic opening.
      if (handoff || error) window.location.replace(link);
    })();
  </script>
</body>
</html>
