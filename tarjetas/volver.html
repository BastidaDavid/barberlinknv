<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BarberLink</title>
    <style>
      body {
        margin: 0;
        background: #f2f2f7;
        font:
          17px/1.5 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 420px;
        margin: 24px;
        padding: 28px;
        background: white;
        border-radius: 24px;
      }
      h1 {
        font-size: 28px;
      }
      p {
        color: #555;
      }
      a {
        display: block;
        padding: 16px;
        border-radius: 16px;
        text-align: center;
        background: black;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tu QR en BarberLink</h1>
      <p>
        La venta de tarjetas ya no está disponible. Puedes descargar o compartir
        tu código QR desde la app.
      </p>
      <a href="barberlink://mi-qr">Abrir mi QR</a>
    </main>
  </body>
</html>
